spring.application.name=frontend
server.port=8080
management.endpoints.web.exposure.include=health,info

# Backends of the SAME environment, e.g. APP_ENV=uat -> http://inventory-uat:8080
# Running locally? Set INVENTORY_URL=http://localhost:8081 and ORDER_URL=http://localhost:8082
store.inventory-url=${INVENTORY_URL:http://inventory-${APP_ENV:local}:8080}
store.order-url=${ORDER_URL:http://order-${APP_ENV:local}:8080}
